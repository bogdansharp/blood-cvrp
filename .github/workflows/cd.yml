# Deploy/promote artifact through staging and production
name: CD
on:
    workflow_dispatch:
      inputs:
        release_tag:
          description: "Release tag to deploy: vX.Y.Z"
          required: true
          type: string
        image_uri:
          description: "Artifact Registry image URI"
          required: true
          type: string

permissions:
  contents: read
  id-token: write
  issues: write

jobs:

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run staging
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ inputs.image_uri }}
          env_vars: |
            ENVIRONMENT=${{ vars.ENVIRONMENT }}
            ORS_BASE_URL=${{ vars.ORS_BASE_URL }}
            OR_TOOLS_TARGET_TIME_SEC=${{ vars.OR_TOOLS_TARGET_TIME_SEC }}
            SOLVER_HARD_TIME_LIMIT_SEC=${{ vars.SOLVER_HARD_TIME_LIMIT_SEC }}
          secrets: |
            ORS_API_KEY=ORS_API_KEY:latest
          
  staging-smoke-tests:
    name: Staging smoke tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      BASE_URL: ${{ vars.STAGING_URL }}

    steps:
      # Checkout to load tests
      - uses: actions/checkout@v6

      - name: API health check
        run: curl --fail "${BASE_URL%/}/api/v1/health/"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run test:e2e

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: staging-smoke-tests
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run production
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ inputs.image_uri }}
          env_vars: |
            ENVIRONMENT=${{ vars.ENVIRONMENT }}
            ORS_BASE_URL=${{ vars.ORS_BASE_URL }}
            OR_TOOLS_TARGET_TIME_SEC=${{ vars.OR_TOOLS_TARGET_TIME_SEC }}
            SOLVER_HARD_TIME_LIMIT_SEC=${{ vars.SOLVER_HARD_TIME_LIMIT_SEC }}
          secrets: |
            ORS_API_KEY=ORS_API_KEY:latest

  # Create issue for production deployment verification
  deployment-verification-issue:
    name: Create production verification issue
    needs: deploy-production
    runs-on: ubuntu-latest
    if: success()
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Create deployment verification issue
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Verify production deployment ${{ inputs.release_tag }}" \
            --body "Check production health, API response, frontend page load, and route display after deployment of ${{ inputs.release_tag }} at $BASE_URL." \
            --label "deployment,verification"

  # Notify stakeholders about deployment
  notify:
    name: Notify deployment result
    needs: [deploy-staging, staging-smoke-tests, deploy-production]
    if: always() # Notify every outcome of CD deployment
    uses: ./.github/workflows/_notify-teams.yml
    with:
      title: "Production Deployment"
      status: "staging=${{ needs.deploy-staging.result }}, smoke=${{ needs.staging-smoke-tests.result }}, production=${{ needs.deploy-production.result }}"
      environment: production
      release_tag: ${{ inputs.release_tag }}
    secrets:
      MS_TEAMS_WEBHOOK_URI: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}