name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Cancel in-progress runs for branch when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Detect which areas of the codebase were changed 
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            workflows:
              - '.github/**'

  # Backend checks
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    needs: changes
    # Run if backend files or workflow files changed, or if it's a push to main
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Linting
      - name: Ruff lint
        run: ruff check .
      
      # Formatting check
      - name: Ruff format check
        run: ruff format --check .

      # Security Static Analysis
      - name: Bandit security scan
        run: bandit -r . -x tests

      # Dependency vulnerability audit
      - name: Dependency audit
        run: pip-audit

      # Run tests with coverage
      - name: Tests
        env:
          ENVIRONMENT: test
          STORAGE_ROOT: backend/seed/storage
          ORS_API_KEY: dummy
          ORS_BASE_URL: https://api.heigit.org/openrouteservice
          OR_TOOLS_TARGET_TIME_SEC: 10
          SOLVER_HARD_TIME_LIMIT_SEC: 600
        run: pytest --cov=. --cov-report=xml

      # Upload coverage report as artifact
      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage.xml
          if-no-files-found: ignore

      # Upload backend source code as artifact
      - name: Upload backend source code
        uses: actions/upload-artifact@v7
        with:
          name: backend-source-${{ github.sha }}
          path: |
            backend/**
            !backend/**/__pycache__/**
            !backend/.pytest_cache/**
            !backend/storage/**
            !backend/**/*.pyc
          if-no-files-found: error

  # Frontend checks
  frontend:
    name: Frontend checks Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: changes
    # Run if frontend files or workflow files changed, or if it's a push to main
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' || github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        # Run full checks on target Node version only
        # and use other Node versions only for compatibility test/build
        include:
          - node-version: "22"
            target-node-version: false
          - node-version: "24"
            target-node-version: true
          - node-version: "26"
            target-node-version: false

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Svelte type checking
      - name: Svelte check
        if: matrix.target-node-version
        run: npm run check

      # Linting
      - name: Lint
        if: matrix.target-node-version
        run: npm run lint

      # Unit tests
      - name: Unit tests
        run: npm test

      # Build the frontend
      - name: Build
        run: npm run build

      # End-to-end tests
      - name: Run Playwright E2E tests
        if: matrix.target-node-version
        run: |
          npx playwright install --with-deps
          npm run test:e2e

      # Dependency vulnerability audit
      - name: Node audit
        if: matrix.target-node-version
        run: npm audit --audit-level=high

      # Upload compiled frontend build as artifact
      - name: Upload frontend build
        if: matrix.target-node-version
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/build
          if-no-files-found: error

  # Software Bill of Materials (SBOM) generation
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: success()

    steps:
      - uses: actions/checkout@v6

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # SBOM as an artifact for further analysis or archiving
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom.spdx.json