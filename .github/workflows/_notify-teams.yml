name: Notify Teams

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      status:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: none
      release_tag:
        required: false
        type: string
        default: ""
    secrets:
      MS_TEAMS_WEBHOOK_URI:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Teams notification
        run: |
          jq -n \
            --arg title "${{ inputs.title }}: ${{ inputs.status }}" \
            --arg environment "${{ inputs.environment }}" \
            --arg release "${{ inputs.release_tag }}" \
            --arg repository "${{ github.repository }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              type: "AdaptiveCard",
              version: "1.4",
              body: [
                {
                  type: "TextBlock",
                  text: $title,
                  weight: "Bolder",
                  size: "Medium",
                  wrap: true
                },
                {
                  type: "FactSet",
                  facts: [
                    { title: "Environment", value: $environment },
                    { title: "Release", value: $release },
                    { title: "Repository", value: $repository },
                    { title: "Run", value: $run_url }
                  ]
                }
              ]
            }' > payload.json

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${{ secrets.MS_TEAMS_WEBHOOK_URI }}"